/* ---------- 冷热分布（按位） ---------- */
function renderHeat3(){
  var d=D[S.lot], sc=scopeRows(S.heatWin||'month'), rows=sc.rows, N=rows.length;
  var h='<div class="card"><div class="bar"><label>窗口</label>'
   +'<select onchange="S.heatWin=this.value;render()">'
   +[['month','近一个月'],['year','近一年'],['all','全部历史']]
     .map(function(o){return '<option value="'+o[0]+'"'+((S.heatWin||'month')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')
   +'</select>'
   +'<label style="color:#aaa;font-size:12px">'+sc.label+' · '+N+' 期</label>'
   +'<div class="seg"><button class="'+(S.heatSort==='num'?'on':'')+'" onclick="S.heatSort=\'num\';render()">按号码</button>'
   +'<button class="'+(S.heatSort==='heat'?'on':'')+'" onclick="S.heatSort=\'heat\';render()">按冷热</button></div>'
   +'</div>';
  var exp=N/10, sd=Math.sqrt(N*0.1*0.9)||1;
  for(var p=0;p<3;p++){
    var cnt=posCnt(rows,p), arr=[];
    for(var n=0;n<=9;n++) arr.push({num:n, cnt:cnt[n], z:(cnt[n]-exp)/sd});
    /* 与双色球一致：按号码 0-9，或按冷热（冷→热） */
    if(S.heatSort==='heat') arr.sort(function(a,b){return a.z-b.z});
    else arr.sort(function(a,b){return a.num-b.num});
    h+='<div class="sec">'+(d.posLabels?d.posLabels[p]:('第'+(p+1)+'位'))+'（0-9）</div><div class="heatgrid">';
    for(var i=0;i<arr.length;i++){
      h+='<div class="hcell" style="background:'+heatColor(arr[i].z)+'">'
        +'<div class="hn">'+arr[i].num+'</div><div class="hc">'+arr[i].cnt+'次</div></div>';
    }
    h+='</div>';
    /* 该位最热 / 最冷 */
    var hot=arr.slice().sort(function(a,b){return b.z-a.z}).slice(0,3);
    var cold=arr.slice().sort(function(a,b){return a.z-b.z}).slice(0,3);
    h+='<div class="toprow"><span style="color:#888">最热</span>';
    hot.forEach(function(r){ h+='<span class="chip" style="background:'+heatColor(r.z)+'">'+r.num+' '+r.cnt+'次</span>'; });
    h+='</div><div class="toprow"><span style="color:#888">最冷</span>';
    cold.forEach(function(r){ h+='<span class="chip" style="background:'+heatColor(r.z)+'">'+r.num+' '+r.cnt+'次</span>'; });
    h+='</div>';
  }
  h+='<div class="lgd"><span class="lgb" style="background:#3b6fd4"></span>极冷'
    +'<span class="lgb" style="background:#8ab0e8;margin-left:6px"></span>偏冷'
    +'<span class="lgb" style="background:#b0b0b0;margin-left:6px"></span>正常'
    +'<span class="lgb" style="background:#ee9182;margin-left:6px"></span>偏热'
    +'<span class="lgb" style="background:#d63a2a;margin-left:6px"></span>极热</div>';
  h+='<div class="note">每位每期出现某数字的理论概率为 10%，冷热按偏离理论次数的标准差判定，'
    +'仅反映已开奖结果，无预测能力。</div></div>';
  return h;
}

/* ---------- 我的选号（按位，一位一个数字） ---------- */
function togglePick3(pos,n){
  S.pick3[pos] = (S.pick3[pos]===n) ? null : n;
  render();
}
function randPick3(){ S.pick3=[Math.floor(Math.random()*10),Math.floor(Math.random()*10),Math.floor(Math.random()*10)]; render(); }
function clearPick3(){ S.pick3=[null,null,null]; render(); }
function addBet3(){
  var i, miss=[];
  for(i=0;i<3;i++) if(S.pick3[i]===null||S.pick3[i]===undefined) miss.push(i);
  if(miss.length){ toast('请为每一位各选一个数字'); return; }
  var bet={r:S.pick3.slice(), b:[], t:Date.now()};
  var a=getBets(); a.push(bet); saveBets(a);
  addRec(S.lot, bet);
  S.pick3=[null,null,null];
  render();
}
function renderMine3(){
  var d=D[S.lot], h='<div class="card"><div class="sec">选择号码（每位各选一个 0-9）</div>';
  for(var p=0;p<3;p++){
    h+='<div style="padding:6px 12px"><div style="font-size:12px;color:#888;margin-bottom:5px">'
      +(d.posLabels?d.posLabels[p]:('第'+(p+1)+'位'))+'</div><div class="grid">';
    for(var n=0;n<=9;n++)
      h+='<span class="nb'+(S.pick3[p]===n?' sel':'')+'" onclick="togglePick3('+p+','+n+')">'+n+'</span>';
    h+='</div></div>';
  }
  h+='<div class="betops" style="margin:10px 12px 0">'
    +'<button onclick="randPick3()">随机一注</button>'
    +'<button class="p" onclick="addBet3()">添加到我的选号</button>'
    +'<button onclick="clearPick3()">清空</button></div>';
  h+='</div>';
  /* 已保存 */
  var bets=getBets();
  h+='<div class="card"><div class="sec">我的选号（'+bets.length+' 注）</div>';
  if(!bets.length){
    h+='<div class="empty">还没有保存的号码</div>';
  }else{
    var last=D[S.lot].rows[D[S.lot].rows.length-1];
    for(var i=bets.length-1;i>=0;i--){
      var bet=bets[i], r=posBetResult(bet);
      h+='<div class="betcard"><div class="bettop"><div>'+fmtBalls({2:bet.r,3:[]},true)+'</div></div>'
        +'<div style="font-size:12px;color:#666;margin-top:4px">'
        +(bet.t?('保存于 '+fmtTs(bet.t)):'')+'</div>';
      if(r.p)
        h+='<div class="bres hit">🎉 <span class="bn">'+r.p.name+'</span>'
          +' · <span class="ba">'+r.p.amt+' 元</span>'
          +' <span style="opacity:.75">（'+esc(r.issue)+' 期 · 开奖 '+r.hit.join(' ')+'）</span></div>';
      else
        h+='<div class="bres">未中奖 <span style="opacity:.75">（'+esc(r.issue)
          +' 期 · 开奖 '+r.hit.join(' ')+'）</span></div>';
      h+='<div class="betops" style="margin:8px 0 0">'
        +'<button onclick="copyBet('+i+')">复制这注</button>'
        +'<button class="delbtn" onclick="delBet('+i+')">删除</button></div></div>';
    }
  }
  h+='<div class="note">按位玩法的号码<b>有顺序</b>：1 2 3 与 3 2 1 不是同一注。'
    +'直选需三位数字与顺序完全相同。</div></div>';
  return h;
}

/* ---------- 中奖核对（按位） ---------- */
function setChk3(pos,n){ S.chk3[pos]=(S.chk3[pos]===n)?null:n; render(); }
function renderCheck3(){
  var d=D[S.lot], rows=d.rows, h='<div class="card"><div class="sec">输入你的号码</div>';
  for(var p=0;p<3;p++){
    h+='<div style="padding:6px 12px"><div style="font-size:12px;color:#888;margin-bottom:5px">'
      +(d.posLabels?d.posLabels[p]:('第'+(p+1)+'位'))+'</div><div class="grid">';
    for(var n=0;n<=9;n++)
      h+='<span class="nb'+(S.chk3[p]===n?' sel':'')+'" onclick="setChk3('+p+','+n+')">'+n+'</span>';
    h+='</div></div>';
  }
  /* 对比期号 */
  var idx=rows.length-1;
  if(S.chkMode==='issue' && S.chkIssue){
    for(var i=0;i<rows.length;i++) if(String(rows[i][0])===String(S.chkIssue)) idx=i;
  }
  var row=rows[idx], hit=row[2], ready=S.chk3.every(function(v){return v!==null&&v!==undefined;});
  h+='<div class="frow" style="padding:0 12px 8px;margin:0"><div class="seg">'
    +'<button class="'+(S.chkMode==='latest'?'on':'')+'" onclick="setChkMode(\'latest\')">最新一期</button>'
    +'<button class="'+(S.chkMode==='issue'?'on':'')+'" onclick="setChkMode(\'issue\')">指定期号</button></div>'
    +(S.chkMode==='issue'
      ? '<input class="ipt" type="text" inputmode="numeric" placeholder="输入期号" value="'+esc(S.chkIssue)+'" oninput="setChkIssue(this.value)">'
      : '')
    +'</div>';
  if(ready){
    var p=posPrize(S.chk3, hit);
    h+='<div class="bres'+(p?' hit':'')+'" style="margin:8px 12px 12px;font-size:13.5px">'
      +(p ? ('🎉 <b>'+p.name+'</b> · <b>'+p.amt+' 元</b><br><span style="opacity:.8">'+p.desc+'</span>')
          : ('未中奖'))
      +'<br><span style="opacity:.75">对比 '+row[0]+' 期（'+row[1]+'）开奖号码：'+hit.join(' ')+'</span></div>';
  }else{
    h+='<div class="bres" style="margin:8px 12px 12px">请为每一位各选一个数字</div>';
  }
  h+='<div class="betops" style="margin:0 12px 10px"><button onclick="S.chk3=[null,null,null];render()">清空</button></div>';
  h+='</div>';
  /* 奖项说明 */
  h+='<div class="card"><div class="sec">奖项说明（固定奖）</div><div class="scroll"><table>'
    +'<thead><tr><th>中奖条件</th><th>奖级</th><th>单注奖金</th></tr></thead><tbody>'
    +'<tr><td>三位数字与顺序完全相同</td><td>直选</td><td>1040 元</td></tr>'
    +'<tr><td>数字相同、顺序不限（有两个相同）</td><td>组选三</td><td>346 元</td></tr>'
    +'<tr><td>数字相同、顺序不限（三个各不相同）</td><td>组选六</td><td>173 元</td></tr>'
    +'</tbody></table></div>'
    +'<div class="note">'+esc(d.name)+'为固定奖玩法，奖金不随销量浮动。'
    +'以上为常规奖级，具体以官方公告为准。</div></div>';
  return h;
}

/* ================= 复式 / 胆拖 ================= */
function C(n,k){
  if(k<0||k>n||n<0) return 0;
  k=Math.min(k,n-k); var r=1,i;
  for(i=1;i<=k;i++){ r=r*(n-k+i)/i; }
  return Math.round(r);
}
function toggleFs(arr,n){
  var i=arr.indexOf(n);
  if(i>=0) arr.splice(i,1); else arr.push(n);
  arr.sort(function(a,b){return a-b});
  render();
}
function comboList(arr,k){
  var out=[];
  (function rec(start,cur){
    if(cur.length===k){ out.push(cur.slice()); return; }
    for(var i=start;i<arr.length;i++){ cur.push(arr[i]); rec(i+1,cur); cur.pop(); }
  })(0,[]);
  return out;
}
function fsCalc(){
  /* 返回 {ok, notes, amt, detail, msg} */
  var d=D[S.lot];
  if(isPos()){
    var a=S.fs3, i, n=a[0].length*a[1].length*a[2].length;
    if(!n) return {ok:false, msg:'请为每一位至少选一个数字'};
    var list=[];
    if(n<=200){
      for(i=0;i<a[0].length;i++) for(var j=0;j<a[1].length;j++) for(var k=0;k<a[2].length;k++)
        list.push([a[0][i],a[1][j],a[2][k]]);
    }
    return {ok:true, notes:n, amt:n*2, list:list,
            msg:'直选复式：百位 '+a[0].length+' 个 × 十位 '+a[1].length+' 个 × 个位 '+a[2].length+' 个'};
  }
  if(S.fsMode==='fushi'){
    var R=S.fsRed.length, B=S.fsBlue.length;
    if(R<d.redCount) return {ok:false, msg:d.redLabel+'至少选 '+d.redCount+' 个（当前 '+R+' 个）'};
    if(B<d.blueCount) return {ok:false, msg:d.blueLabel+'至少选 '+d.blueCount+' 个（当前 '+B+' 个）'};
    var c=C(R,d.redCount)*C(B,d.blueCount);
    var l2=[];
    if(c<=200){
      var rc=comboList(S.fsRed,d.redCount), bc=comboList(S.fsBlue,d.blueCount);
      for(var x=0;x<rc.length;x++) for(var y=0;y<bc.length;y++) l2.push({r:rc[x], b:bc[y]});
    }
    return {ok:true, notes:c, amt:c*2, list:l2,
            msg:'复式：'+d.redLabel+'选 '+R+' 个（C('+R+','+d.redCount+')='+C(R,d.redCount)+'）'
                +' × '+d.blueLabel+'选 '+B+' 个（C('+B+','+d.blueCount+')='+C(B,d.blueCount)+'）'};
  }
  /* 胆拖 */
  var dan=S.fsDan.length, tuo=S.fsTuo.length, B2=S.fsBlue.length;
  if(dan<1) return {ok:false, msg:'请至少选 1 个胆码'};
  if(dan>=d.redCount) return {ok:false, msg:'胆码最多选 '+(d.redCount-1)+' 个（当前 '+dan+' 个）'};
  if(dan+tuo<d.redCount) return {ok:false, msg:'胆码 + 拖码至少要 '+d.redCount+' 个（当前 '+(dan+tuo)+' 个）'};
  if(B2<d.blueCount) return {ok:false, msg:d.blueLabel+'至少选 '+d.blueCount+' 个（当前 '+B2+' 个）'};
  var need=d.redCount-dan;
  var c3=C(tuo,need)*C(B2,d.blueCount);
  var l3=[];
  if(c3<=200){
    var tc=comboList(S.fsTuo,need), b3=comboList(S.fsBlue,d.blueCount);
    for(var m=0;m<tc.length;m++) for(var q=0;q<b3.length;q++)
      l3.push({r:S.fsDan.concat(tc[m]).sort(function(a,b){return a-b}), b:b3[q]});
  }
  return {ok:true, notes:c3, amt:c3*2, list:l3,
          msg:'胆拖：胆码 '+dan+' 个 + 拖码 '+tuo+' 个（C('+tuo+','+need+')='+C(tuo,need)+'）'
              +' × '+d.blueLabel+' '+C(B2,d.blueCount)};
}
function fsText(){
  var r=fsCalc(); if(!r.ok) return '';
  if(isPos()) return S.fs3[0].join('')+' * '.replace('*','')+'';
  return '';
}
function fsCopy(){
  var r=fsCalc();
  if(!r.ok){ toast(r.msg); return; }
  var t;
  if(isPos()){
    t=(S.fs3[0].join('')+' | '+S.fs3[1].join('')+' | '+S.fs3[2].join(''))
      +'\n直选复式 '+r.notes+' 注，'+r.amt+' 元';
  }else{
    if(S.fsMode==='fushi')
      t=D[S.lot].redLabel+' '+S.fsRed.join(' ')+'\n'+D[S.lot].blueLabel+' '+S.fsBlue.join(' ');
    else
      t='胆码 '+S.fsDan.join(' ')+'\n拖码 '+S.fsTuo.join(' ')+'\n'+D[S.lot].blueLabel+' '+S.fsBlue.join(' ');
    t+='\n'+r.notes+' 注，'+r.amt+' 元';
  }
  copyText(t);
}
function renderFsdt(){
  var d=D[S.lot], h='';
  var r=fsCalc();
  /* 号码盘 */
  if(isPos()){
    h+='<div class="card"><div class="sec">直选复式（每位可多选）</div>';
    for(var p=0;p<3;p++){
      h+='<div style="padding:6px 12px"><div style="font-size:12px;color:#888;margin-bottom:5px">'
        +(d.posLabels?d.posLabels[p]:('第'+(p+1)+'位'))+'（已选 '+S.fs3[p].length+' 个）</div><div class="grid">';
      for(var n=0;n<=9;n++)
        h+='<span class="nb'+(S.fs3[p].indexOf(n)>=0?' sel':'')+'" onclick="toggleFs(S.fs3['+p+'],'+n+')">'+n+'</span>';
      h+='</div></div>';
    }
    h+='<div class="betops" style="margin:10px 12px 0">'
      +'<button onclick="S.fs3=[[],[],[]];render()">清空</button>'
      +'<button onclick="fsCopy()">复制号码</button></div></div>';
  }else{
    h+='<div class="card"><div class="bar"><label>投注方式</label>'
      +'<div class="seg"><button class="'+(S.fsMode==='fushi'?'on':'')+'" onclick="S.fsMode=\'fushi\';render()">复式</button>'
      +'<button class="'+(S.fsMode==='dantuo'?'on':'')+'" onclick="S.fsMode=\'dantuo\';render()">胆拖</button></div></div>';
    if(S.fsMode==='fushi'){
      h+='<div style="padding:6px 12px"><div style="font-size:12px;color:#888;margin-bottom:5px">'
        +d.redLabel+'（1-'+d.redMax+'，已选 '+S.fsRed.length+' 个，至少 '+d.redCount+' 个）</div><div class="grid">';
      for(var a=1;a<=d.redMax;a++)
        h+='<span class="nb'+(S.fsRed.indexOf(a)>=0?' sel':'')+'" onclick="toggleFs(S.fsRed,'+a+')">'+pad(a)+'</span>';
      h+='</div></div>';
    }else{
      h+='<div style="padding:6px 12px"><div style="font-size:12px;color:#888;margin-bottom:5px">'
        +'胆码（每注必含，1 ~ '+(d.redCount-1)+' 个，已选 '+S.fsDan.length+' 个）</div><div class="grid">';
      for(var b2=1;b2<=d.redMax;b2++)
        h+='<span class="nb'+(S.fsDan.indexOf(b2)>=0?' sel':'')+'" onclick="toggleFs(S.fsDan,'+b2+')">'+pad(b2)+'</span>';
      h+='</div></div>';
      h+='<div style="padding:6px 12px"><div style="font-size:12px;color:#888;margin-bottom:5px">'
        +'拖码（已选 '+S.fsTuo.length+' 个）</div><div class="grid">';
      for(var c2=1;c2<=d.redMax;c2++){
        var isDan=S.fsDan.indexOf(c2)>=0;
        h+='<span class="nb'+(S.fsTuo.indexOf(c2)>=0?' sel':'')+'" style="'+(isDan?'opacity:.35':'')+'" '
          +'onclick="toggleFs(S.fsTuo,'+c2+')">'+pad(c2)+'</span>';
      }
      h+='</div><div class="note" style="padding:4px 0 0">同一个号码不要同时做胆码和拖码</div></div>';
    }
    h+='<div style="padding:6px 12px"><div style="font-size:12px;color:#888;margin-bottom:5px">'
      +d.blueLabel+'（1-'+d.blueMax+'，已选 '+S.fsBlue.length+' 个，至少 '+d.blueCount+' 个）</div><div class="grid">';
    for(var e=1;e<=d.blueMax;e++)
      h+='<span class="nb b'+(S.fsBlue.indexOf(e)>=0?' sel':'')+'" onclick="toggleFs(S.fsBlue,'+e+')">'+pad(e)+'</span>';
    h+='</div></div>';
    h+='<div class="betops" style="margin:10px 12px 0">'
      +'<button onclick="S.fsRed=[];S.fsBlue=[];S.fsDan=[];S.fsTuo=[];render()">清空</button>'
      +'<button onclick="fsCopy()">复制号码</button></div></div>';
  }
  /* 结果 */
  h+='<div class="card"><div class="sec">投注金额</div>';
  if(!r.ok){
    h+='<div class="bres" style="margin:0 12px 12px">'+esc(r.msg)+'</div>';
  }else{
    h+='<div class="amtbig"><span>共 '+r.notes+' 注</span>'
      +'<b>'+moneyFull(r.amt)+' 元</b></div>'
      +'<div class="amtwarn">⚠️ 复式 / 胆拖的金额会<b>随选号个数成倍增长</b>，'
      +'上面这个数字才是你实际要付的钱。付款前请再核对一次。</div>'
      +'<div class="note" style="padding:0 12px 8px">'+esc(r.msg)+' · 每注 2 元</div>';
    if(r.list && r.list.length && r.list.length<=200){
      h+='<div class="sec">注明细（'+r.list.length+' 注）</div><div class="scroll" style="max-height:280px"><table>'
        +'<thead><tr><th>#</th><th>号码</th></tr></thead><tbody>';
      for(var i=0;i<r.list.length;i++){
        var it=r.list[i];
        h+='<tr><td>'+(i+1)+'</td><td>'+(isPos()? it.join(' ') : (fmtBalls({2:it.r,3:it.b})))+'</td></tr>';
      }
      h+='</tbody></table></div>';
    }else if(r.list && r.list.length===0 && r.notes>200){
      h+='<div class="note" style="padding:0 12px 10px">注数较多，未展开明细。</div>';
    }
  }
  h+='</div>';
  h+='<div class="card"><div class="sec">说明</div><div class="note" style="padding:0 12px 10px">'
    +'<b>复式</b>：选出比单式更多的号码，覆盖这些号码的所有组合。<br>'
    +'<b>胆拖</b>：胆码是每注都包含的号码，拖码用来补足剩余位置，比全复式省钱。<br>'
    +'两者<b>只改变覆盖面，不改变中奖概率的数学期望</b>——花得越多，覆盖的组合越多，'
    +'但每注的中奖概率完全相同。请量力而行。</div></div>';
  return h;
}

function setLot(l){
  S.lot=l;S.listLimit=60;S.listQ='';S.pickRed=[];S.pickBlue=[];S.trendSel={};
  S.chkRed=[];S.chkBlue=[];S.chkMode='latest';S.chkIssue='';
  S.genSum=null;S.genOdd='any';S.genBig='any';S.genZone='any';S.genMsg='';
  S.pSort={k:0,dir:1};S.pick3=[null,null,null];S.chk3=[null,null,null];S.fs3=[[],[],[]];
  S.fSort3={p0:{k:1,dir:1}, p1:{k:1,dir:1}, p2:{k:1,dir:1}};
  S.fsRed=[];S.fsBlue=[];S.fsDan=[];S.fsTuo=[];S.recDel=-1;S.recClear=false;
  boot();
}
function setTab(t){S.tab=t;S.recDel=-1;S.recClear=false;render()}
function render(){
  /* 未激活授权时直接显示锁屏，不渲染任何数据 */
  if(licBlocked()){ var ml=$('main'); if(ml) ml.innerHTML=renderLock(); licInitMenu(); return; }
  if(!D[S.lot]){showLoading();return}
  ['ssq','dlt','3d','pls'].forEach(function(l){
    var b=$('b-'+l); if(b) b.className = S.lot===l?'on':'';
  });
  ['list','trend','freq','heat','mine','rec','check','fsdt'].forEach(function(t){$('t-'+t).className = S.tab===t?'on':''});
  $('t-menu').className = '';
  var m=$('main'), h=head()+latest();
  var P=isPos();
  if(S.tab==='list')   h+= P?renderList3():renderList();
  else if(S.tab==='trend') h+= P?renderTrend3():renderTrend();
  else if(S.tab==='freq')  h+= P?renderFreq3():renderFreq();
  else if(S.tab==='heat')  h+= P?renderHeat3():renderHeat();
  else if(S.tab==='mine')  h+= P?renderMine3():renderMine();
  else if(S.tab==='check') h+= P?renderCheck3():renderCheck();
  else if(S.tab==='fsdt')  h+= renderFsdt();
  else if(S.tab==='rec')   h+= renderRec();
  else h+=renderMine();
  /* 页签较多时，让当前页签滚到可见处 */
  var tb=$('t-'+S.tab);
  if(tb && tb.scrollIntoView) try{ tb.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){}
  m.innerHTML=h;
  startCountdown();          /* 倒计时每秒自更新，只改这一个元素，不整页重绘 */
}
function boot(){
  if(licBlocked()){ var mb=$('main'); if(mb) mb.innerHTML=renderLock(); licInitMenu(); return; }
  ensure(S.lot).then(function(){
    render();
    var seen=null; try{ seen=localStorage.getItem(HELP_SEEN); }catch(e){}
    if(!seen) showHelp();
  }).catch(function(){});
}
licInitMenu();
boot();
</script>
