<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8402a">
<title>彩票统计（离线单文件版）· 双色球 / 大乐透</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
 background:#f2f3f5;color:#1a1a1a;font-size:14px;-webkit-text-size-adjust:100%;
 padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid #e5e5e5;
 padding:10px 12px 0;padding-top:calc(10px + env(safe-area-inset-top))}
.lot{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.lot button{flex:1;padding:10px 0;border:1px solid #d0d0d0;background:#fff;border-radius:8px;
 font-size:15px;font-weight:600;color:#555;cursor:pointer}
.lot button.on{background:#e8402a;color:#fff;border-color:#e8402a}
/* 菜单按钮：纯 CSS 三条杠，不依赖字体，绝不出现问号/方块乱码 */
.menu{width:38px;height:38px;border-radius:8px;border:1px solid #ddd;background:#fff;flex:none;
 cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.menu i{display:block;width:18px;height:2px;background:#888;border-radius:1px}
.menu:active{background:#f5f5f5}
.sidemask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:150;display:none}
.sidemask.on{display:block}
.sidepanel{position:absolute;left:0;top:0;bottom:0;width:264px;max-width:82vw;background:#fff;
 box-shadow:2px 0 14px rgba(0,0,0,.16);display:flex;flex-direction:column;overflow:auto;
 padding-top:env(safe-area-inset-top);animation:slidein .22s ease}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.sidehead{padding:16px 16px 12px;font-size:16px;font-weight:700;color:#222;
 border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
.sidehead span{color:#bbb;font-size:22px;cursor:pointer;line-height:1;padding:0 2px}
.sideitem{padding:13px 16px;font-size:14.5px;color:#333;border-bottom:1px solid #f5f5f5;
 cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sideitem:active{background:#f7f7f7}
.sideitem em{font-style:normal;font-size:11.5px;color:#aaa;font-weight:400}
.sideitem.danger{color:#c62828}
.sidenote{padding:14px 16px;font-size:11.5px;color:#aaa;line-height:1.7;margin-top:auto}
.tabs{display:flex;gap:2px}
.tabs button{flex:1;padding:9px 0;border:none;background:none;font-size:12.5px;color:#888;
 border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:#e8402a;font-weight:600;border-bottom-color:#e8402a}
main{padding:10px 12px 24px}
.card{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:12px;
 box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.bar label{font-size:13px;color:#666}
.seg{display:flex;border:1px solid #ddd;border-radius:6px;overflow:hidden}
.seg button{padding:5px 12px;border:none;background:#fff;font-size:12.5px;color:#666;cursor:pointer}
.seg button.on{background:#e8402a;color:#fff}
select{padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fff;color:#333}
.chk{display:flex;align-items:center;gap:4px;font-size:12.5px;color:#666;cursor:pointer}
.hint{font-size:12px;color:#999;padding:8px 12px;line-height:1.5}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid #f2f2f2}
th{background:#fafafa;font-weight:600;color:#555;cursor:pointer;user-select:none}
th .ar{color:#e8402a;font-size:11px;margin-left:2px}
th.act{color:#e8402a}
td.l{text-align:left}
tr.hl{background:#fff3d6}
tr.hl td{border-bottom-color:#f0e2bd}
.balls{display:flex;gap:3px;justify-content:center;align-items:center;flex-wrap:wrap}
.b{width:22px;height:22px;line-height:22px;border-radius:50%;font-size:12px;font-weight:600;
 text-align:center;display:inline-block}
.b.r{background:#e8402a;color:#fff}
.b.bl{background:#2b6cd4;color:#fff}
.b.big{width:28px;height:28px;line-height:28px;font-size:14px}
.sep{color:#ccc;margin:0 2px}
.more{display:block;width:100%;padding:11px;border:none;background:#fff;color:#e8402a;
 font-size:14px;cursor:pointer;border-top:1px solid #f0f0f0}
.state{padding:40px 16px;text-align:center;color:#888;font-size:14px;line-height:1.8}
.spin{width:26px;height:26px;border:3px solid #eee;border-top-color:#e8402a;border-radius:50%;
 margin:0 auto 12px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:#c33}
button.retry{margin-top:10px;padding:8px 18px;border:1px solid #e8402a;background:#fff;color:#e8402a;
 border-radius:6px;font-size:14px;cursor:pointer}
.upd{font-size:11px;color:#aaa;padding:6px 12px 2px}
.warn{background:#fff8e6;color:#8a6100;font-size:12px;padding:8px 12px;line-height:1.5}
.sec{padding:8px 12px;background:#fafafa;font-size:13px;font-weight:600;color:#555;border-bottom:1px solid #f0f0f0}
.note{font-size:11px;color:#aaa;padding:8px 12px;line-height:1.6}
/* 走势：点阵 */
.svgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff}
svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:3px;padding:8px 10px;border-top:1px solid #f0f0f0}
.lg{width:26px;height:22px;line-height:22px;text-align:center;font-size:10px;border-radius:3px;
 color:#fff;font-weight:600;cursor:pointer;opacity:.95}
.lg.off{opacity:.28}
.tip{padding:16px 12px;text-align:center;color:#aaa;font-size:13px}
.onepick{display:flex;flex-wrap:wrap;gap:4px}
.onb{width:26px;height:24px;line-height:24px;text-align:center;border-radius:4px;
 font-size:11px;font-weight:600;cursor:pointer;color:#fff}
.onb.sel{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #333}
.statcard{margin:2px 12px 10px;padding:12px 12px 6px;background:#fafafa;border-radius:10px;
 border:1px solid #f0f0f0}
.sctop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.scnum{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;
 border-radius:5px;color:#fff;font-size:12px;font-weight:700;padding:0 6px}
.sctop select{margin-left:auto;font-size:12px;padding:4px 6px;border:1px solid #e2e2e2;
 border-radius:6px;background:#fff;color:#555}
.scmain{display:flex;gap:8px;margin-bottom:10px}
.sci{flex:1;background:#fff;border:1px solid #eeeeee;border-radius:8px;padding:9px 4px;text-align:center}
.sci em{display:block;font-style:normal;font-size:19px;font-weight:700;color:#222;line-height:1.25}
.sci span{display:block;font-size:10.5px;color:#999;margin-top:3px}
.sctbl{border-top:1px solid #eeeeee;padding-top:6px}
.scr{display:flex;justify-content:space-between;align-items:center;padding:5px 2px;
 font-size:12px;border-bottom:1px solid #f4f4f4}
.scr:last-child{border-bottom:none}
.scr span{color:#888}
.scr b{color:#333;font-weight:600}
.onestat{font-size:12px;color:#666;padding:4px 12px 12px;line-height:1.7}
.onestat b{color:#333;font-size:13px}
/* 冷热：方格 */
.heatgrid{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px}
.hcell{width:calc((100% - 30px)/7);border-radius:6px;padding:5px 0;text-align:center;color:#fff}
.hn{font-size:13px;font-weight:700;line-height:1.1}
.hc{font-size:9.5px;opacity:.9;line-height:1.2}
.toprow{display:flex;gap:6px;align-items:center;padding:4px 12px;font-size:12px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 7px;border-radius:10px;color:#fff;font-size:11px;font-weight:600}
.lgd{display:flex;gap:6px;padding:6px 12px 10px;flex-wrap:wrap;font-size:11px;color:#666;align-items:center}
.lgb{width:16px;height:10px;border-radius:2px;display:inline-block}
/* 我的选号 */
.pick{padding:10px 12px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.nb{width:34px;height:34px;line-height:34px;text-align:center;border-radius:50%;
 border:1px solid #ddd;background:#fff;font-size:13px;color:#555;cursor:pointer}
.nb.sel{background:#e8402a;color:#fff;border-color:#e8402a;font-weight:600}
.nb.sel.b{background:#2b6cd4;border-color:#2b6cd4}
.btns{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.btns button{padding:8px 14px;border-radius:6px;border:1px solid #e8402a;background:#fff;
 color:#e8402a;font-size:13px;cursor:pointer}
.btns button.g{border-color:#ccc;color:#666}
.btns button.p{background:#e8402a;color:#fff}
.btns button.dis{background:#f5f5f5;border-color:#e0e0e0;color:#bbb}
.prev{background:#fafafa;border:1px dashed #e0e0e0;border-radius:8px;padding:10px;margin:8px 0}
.msg{font-size:12px;line-height:1.9;padding:0 2px}
.msg .e{color:#c62828}
.msg .w{color:#e07b00}
.msg .ok{color:#2e7d32}
.betcard{border-top:1px solid #f0f0f0;padding:12px}
.bettop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kv{font-size:12px;color:#666;line-height:1.9;margin-top:6px}
.kv b{color:#333;font-weight:600}
.tagline{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;margin-right:4px}
.tag-ok{background:#e8f5e9;color:#2e7d32}
.tag-no{background:#f5f5f5;color:#888}
.tag-hot{background:#ffebee;color:#c62828}
.del{border:none;background:none;color:#ccc;font-size:18px;cursor:pointer;padding:0 4px}
.empty{padding:30px 12px;text-align:center;color:#aaa;font-size:13px}
/* 说明弹层 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;
 align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
.mh{padding:14px 16px;border-bottom:1px solid #f0f0f0;font-size:16px;font-weight:600;
 display:flex;justify-content:space-between;align-items:center}
.mh span{color:#aaa;font-size:22px;cursor:pointer;line-height:1}
.mb{padding:12px 16px 18px;font-size:13px;line-height:1.85;color:#444}
.mb h4{font-size:13px;color:#e8402a;margin:12px 0 3px}
.mb h4:first-child{margin-top:0}
.mb p{color:#666}
.mb b{color:#333}
.mb ul{margin:2px 0 0 16px;color:#666}
</style>
</head>
<body>
<header>
  <div class="lot">
    <button id="b-ssq" onclick="setLot('ssq')">双色球</button>
    <button id="b-dlt" onclick="setLot('dlt')">大乐透</button>

  </div>
  <div class="tabs">
    <button id="t-menu" onclick="openSide()">菜单</button>
    <button id="t-list" onclick="setTab('list')">开奖记录</button>
    <button id="t-trend" onclick="setTab('trend')">号码走势</button>
    <button id="t-freq" onclick="setTab('freq')">出现次数</button>
    <button id="t-heat" onclick="setTab('heat')">冷热分布</button>
    <button id="t-mine" onclick="setTab('mine')">我的选号</button>
  </div>
</header>
<main id="main"></main>
<div id="side" class="sidemask" onclick="if(event.target===this)closeSide()">
  <div class="sidepanel">
    <div class="sidehead">菜单<span onclick="closeSide()">×</span></div>
    <div class="sideitem" onclick="closeSide();showHelp()">功能说明<em>各页面怎么看</em></div>
    <div class="sideitem" onclick="closeSide();showSource()">数据来源<em>官方接口</em></div>
    <div class="sideitem" onclick="refreshData()">刷新数据<em>强制重新抓取</em></div>
    <div class="sideitem" onclick="clearMyBets()">清除本机选号<em>仅本机</em></div>
    <div class="sidenote">数据实时取自中国福彩网 / 中国体彩官方接口，本页面不做任何预测。</div>
  </div>
</div>
<div id="modal"></div>

<script>
var API = (location.pathname.indexOf('/api/')===0 ? '' : './api') ;
var D = {};
/* 静态标记：由构建时注入，true=纯静态托管（无后端） */
var STATIC_BUILD = true;
var S = {noApi:STATIC_BUILD, lot:'ssq', tab:'list',
  listSort:{k:0,dir:-1}, listLimit:60,
  trendNum:1, trendScope:'month', distLimit:20,
  fSort:{red:{k:1,dir:1}, blue:{k:1,dir:1}},
  heatWin:'month', heatSort:'num',
  pickRed:[], pickBlue:[]};

function $(id){return document.getElementById(id)}
/* 期号短标：双色球 2026122→26122，大乐透 26121→26121，统一 5 位，避免两者混淆 */
function issShort(r){ var v=String(r[0]); return v.length>5? v.slice(-5) : v; }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function pad(n){return n<10?'0'+n:''+n}
function api(p){return fetch(API+p, {cache:'no-store'}).then(function(r){
  if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})}
function numColor(n,max){ return 'hsl('+Math.round(((n-1)*137.508)%360)+',68%,46%)'; }
/* 视口可用宽度：让 33/35 列尽量在一屏内放下，避免横滑 */
function vw(){
  try{ return (document.documentElement&&document.documentElement.clientWidth)||window.innerWidth||375; }
  catch(e){ return 375; }
}

/* ---------- 加载 ---------- */
function load(lot, force){
  /* 静态托管模式：优先读同目录 data/xx.json（无需后端，免备案可分享）
     读不到再回退到后端 /api/history（自建服务器 / 云函数部署时用） */
  return fetch('./data/'+lot+'.json', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('no-static');
    var ct = r.headers.get('content-type')||'';
    if(ct.indexOf('text/html')>=0) throw new Error('no-static');
    return r.json();
  }).then(function(d){
    if(!d || !d.rows || !d.rows.length) throw new Error('no-static');
    d.staticMode = true; return d;
  }).catch(function(){
    if(S.noApi) throw new Error('数据文件缺失');
    return api('/history?lot='+lot+(force?'&force=1':''));
  }).then(function(d){
    if(!d || !d.rows || !d.rows.length) throw new Error('空数据');
    D[lot]=d; return d;
  });
}
function ensure(lot){
  if(D[lot]) return Promise.resolve(D[lot]);
  showLoading();
  return load(lot).catch(function(e1){
    /* 静态模式下没有后端可重试，直接报错；有后端时强制刷新重试一次 */
    if(S.noApi){ showError((e1.message||String(e1))+'（静态托管模式：请重新上传 data/'+lot+'.json）'); throw e1; }
    return load(lot, true).catch(function(e2){ showError(e2.message||String(e2)); throw e2; });
  });
}
function showLoading(){
  var n = S.lot==='ssq'?'双色球':'大乐透';
  $('main').innerHTML='<div class="card"><div class="state"><div class="spin"></div>'
    +'正在获取'+n+'最新开奖数据…<br><span style="font-size:12px;color:#aaa">首次加载需从官方接口抓取，请稍候</span></div></div>';
}
function showError(msg){
  $('main').innerHTML='<div class="card"><div class="state err">数据获取失败<br>'
    +'<span style="font-size:12px">'+esc(msg)+'</span>'
    +'<br><button class="retry" onclick="delete D[S.lot];boot()">重试</button></div></div>';
}

/* ---------- 通用 ---------- */
function oddStr(r){
  var n=D[S.lot].redCount, o=0;
  for(var i=0;i<r[2].length;i++) if(r[2][i]%2) o++;
  return o+':'+(n-o);
}
function sumRed(r){var s=0;for(var i=0;i<r[2].length;i++)s+=r[2][i];return s}
function fmtBalls(r,big){
  var h='<div class="balls">', c=big?'b r big':'b r', cb=big?'b bl big':'b bl';
  for(var i=0;i<r[2].length;i++) h+='<span class="'+c+'">'+pad(r[2][i])+'</span>';
  h+='<span class="sep">+</span>';
  for(var j=0;j<r[3].length;j++) h+='<span class="'+cb+'">'+pad(r[3][j])+'</span>';
  return h+'</div>';
}
function rbOverlap(r){
  var s={};
  for(var i=0;i<r[2].length;i++) s[r[2][i]]=1;
  for(var j=0;j<r[3].length;j++) if(s[r[3][j]]) return true;
  return false;
}
function sameArr(a,b){
  if(!a||!b||a.length!==b.length) return false;
  for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
  return true;
}

/* ---------- 开奖记录 ---------- */
function listRows(){
  var arr=D[S.lot].rows.slice(), k=S.listSort.k, dir=S.listSort.dir;
  arr.sort(function(a,b){
    var x,y;
    if(k===0){x=a[0];y=b[0]}
    else if(k===1){x=a[1];y=b[1]}
    else if(k===2){x=a[0];y=b[0]}
    else if(k===3){
      var oa=0,ob=0,i;
      for(i=0;i<a[2].length;i++) if(a[2][i]%2) oa++;
      for(i=0;i<b[2].length;i++) if(b[2][i]%2) ob++;
      if(oa!==ob) return (oa<ob?-dir:dir);
      x=a[0];y=b[0];
    } else {x=sumRed(a);y=sumRed(b)}
    if(x<y) return -dir; if(x>y) return dir; return a[0]<b[0]?1:-1;
  });
  return arr;
}
function renderList(){
  var all=listRows(), show=all.slice(0,S.listLimit);
  var cols=['期号','开奖日期','开奖号码','奇偶比','和值'];
  var h='<div class="card"><div class="bar"><label>共 '+all.length+' 期</label>'
    +'<label style="color:#aaa;font-size:12px">默认期号降序 ▼，点击表头切换</label></div>'
    +'<div class="scroll"><table><thead><tr>';
  for(var c=0;c<cols.length;c++)
    h+='<th class="'+(S.listSort.k===c?'act':'')+'" onclick="sortList('+c+')">'
      +cols[c]+(S.listSort.k===c?'<span class="ar">'+(S.listSort.dir===1?'▲':'▼')+'</span>':'')+'</th>';
  h+='</tr></thead><tbody>';
  for(var i=0;i<show.length;i++){
    var r=show[i];
    h+='<tr class="'+(rbOverlap(r)?'hl':'')+'"><td>'+r[0]+'</td><td class="l">'+r[1]+'</td>'
      +'<td>'+fmtBalls(r)+'</td><td>'+oddStr(r)+'</td><td>'+sumRed(r)+'</td></tr>';
  }
  h+='</tbody></table></div>';
  if(S.listLimit<all.length)
    h+='<button class="more" onclick="S.listLimit+=60;render()">加载更多（还有 '+(all.length-S.listLimit)+' 期）</button>';
  h+='<div class="note">黄底行 = 该期'+D[S.lot].blueLabel+'与'+D[S.lot].redLabel+'号码有重合</div></div>';
  return h;
}
function sortList(k){
  if(S.listSort.k===k) S.listSort.dir*=-1; else {S.listSort.k=k;S.listSort.dir=1}
  render();
}

/* ---------- 号码走势 ---------- */
/* 只画「历史号码分布」圆点图 + 单号统计卡，不画折线 */

/* 期数范围：近一个月 / 近一年 / 全部（按开奖日期计算） */
function scopeRows(kind){
  var all=D[S.lot].rows;
  if(kind==='all') return {rows:all, n:all.length, label:'全部'};
  var days=(kind==='month')?30:365;
  var t=new Date(all[all.length-1][1]).getTime();
  var i=all.length-1;
  while(i>0 && new Date(all[i][1]).getTime() > t-days*86400000) i--;
  return {rows:all.slice(i), n:all.length-i, label:(kind==='month')?'近一个月':'近一年'};
}
function renderTrend(){
  var d=D[S.lot];
  var all=d.rows.slice().reverse();          /* 最新在前 */
  var lim=S.distLimit||20;
  var disp=all.slice(0,lim);                 /* 当前显示（最新 N 期） */
  var h='<div class="card"><div class="bar"><label>历史号码分布</label>'
   +'<label style="color:#aaa;font-size:12px">共 '+all.length+' 期，默认最新 '+lim+' 期</label></div>';
  h+=distChart(disp,d,all.length,lim);
  h+=numStatCard();
  h+='<div class="note">左列＝开奖日期，圆点＝该期开出的'+d.redLabel+'。'

  return h;
}

/* 历史号码分布图：行=日期，列=号码，只有圆点；支持加载更多 */
function distChart(rows,d,total,lim){
  var max=d.redMax, padL=54, headH=26;
  var xr=padL-6;                        /* 左列统一右对齐位置 */
  var avail=vw()-26-2;
  var cw=Math.max(11, Math.min(20, (avail-padL-6)/max));
  var rh=Math.max(26, Math.min(30, cw+11));   /* 两行文字需更高行距 */
  var H=headH+rows.length*rh+8, W=padL+max*cw+6;
  var s='<div class="svgwrap" style="overflow-x:auto"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  /* 顶部号码彩条 */
  for(var n=1;n<=max;n++){
    var x=padL+(n-1)*cw;
    s+='<rect x="'+(x+0.5)+'" y="3" width="'+(cw-2)+'" height="18" rx="2" fill="'+numColor(n,max)+'"/>';
    s+='<text x="'+(x+cw/2)+'" y="'+(16)+'" font-size="8" fill="#fff" text-anchor="middle"'
      +' font-weight="600" pointer-events="none">'+n+'</text>';
  }
  s+='<text x="'+xr+'" y="10" font-size="7.5" fill="#aaa" text-anchor="end">期号</text>';
  s+='<text x="'+xr+'" y="21" font-size="7.5" fill="#aaa" text-anchor="end">开奖日期</text>';
  /* 逐期 */
  for(var i=0;i<rows.length;i++){
    var y=headH+i*rh, cy=y+rh/2;
    if(i%2===1) s+='<rect x="0" y="'+y+'" width="'+W+'" height="'+rh+'" fill="#fbfbfb"/>';
    /* 第一行：期号（与开奖记录完全一致） */
    s+='<text x="'+xr+'" y="'+(cy-2)+'" font-size="8" fill="#666" text-anchor="end"'
      +' font-weight="600">'+rows[i][0]+'</text>';
    /* 第二行：完整开奖日期（含年份） */
    s+='<text x="'+xr+'" y="'+(cy+9)+'" font-size="6.8" fill="#aaa" text-anchor="end">'
      +rows[i][1]+'</text>';
    var arr=rows[i][2].slice().sort(function(a,b){return a-b});
    for(var k2=0;k2<arr.length;k2++){
      var cx=padL+(arr[k2]-1)*cw+cw/2, r=Math.min(cw,rh)/2-1.5;
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+numColor(arr[k2],max)+'"/>';
      if(cw>=14) s+='<text x="'+cx+'" y="'+(cy+3.4)+'" font-size="8" fill="#fff" text-anchor="middle"'
        +' font-weight="700" pointer-events="none">'+arr[k2]+'</text>';
    }
  }
  s+='</svg></div>';
  /* 蓝球条 */
  var bw=Math.max(9,Math.min(16,(avail-padL-6)/d.blueMax));
  var bh=20, bH=bh+6, bW=padL+d.blueMax*bw+6;
  s+='<div class="svgwrap" style="overflow-x:auto"><svg width="'+bW+'" height="'+bH+'" viewBox="0 0 '+bW+' '+bH+'">';
  s+='<text x="'+xr+'" y="'+(bh/2+4)+'" font-size="8.5" fill="#999" text-anchor="end">'+d.blueLabel+'</text>';
  for(var b=1;b<=d.blueMax;b++){
    var bx=padL+(b-1)*bw;
    var hit=(rows[0][3][0]===b);
    s+='<rect x="'+(bx+0.5)+'" y="2" width="'+(bw-2)+'" height="'+(bh-2)+'" rx="3"'
      +' fill="'+(hit?'#2b6cd4':'#f2f2f2')+'"/>';
    s+='<text x="'+(bx+bw/2)+'" y="'+(bh/2+3.5)+'" font-size="8" fill="'+(hit?'#fff':'#aaa')+'"'
      +' text-anchor="middle" font-weight="'+(hit?'700':'400')+'">'+b+'</text>';
  }
  s+='</svg></div>';
  s+='<div class="note">左两列＝<b>期号</b>（与开奖记录一致）与<b>开奖日期</b>；'
    +'当前显示最新 <b>'+rows.length+'</b> 期（'+rows[rows.length-1][0]+' '+rows[rows.length-1][1]
    +' ~ '+rows[0][0]+' '+rows[0][1]+'）；下方色块标出最新一期'+d.blueLabel+'。</div>';
  /* 加载更多 */
  if(lim<total)
    s+='<button class="more" onclick="S.distLimit+=20;render()">加载更多（还有 '+(total-lim)+' 期）</button>';
  else if(total>20)
    s+='<button class="more" onclick="S.distLimit=20;render()">收起（仅看最新 20 期）</button>';
  return s;
}

/* 单号统计卡：历史 + 近期窗口 + 遗漏 */
function statLine(num,max,rowsWin,lab){
  lab=lab||'近一个月';
  var all=D[S.lot].rows, d=D[S.lot], col=numColor(num,max);
  /* 全历史 */
  var tot=0, miss=0, mx=0, k;
  for(k=0;k<all.length;k++){
    if(all[k][2].indexOf(num)>=0){ tot++; if(miss>mx) mx=miss; miss=0; }
    else miss++;
  }
  var avg=tot? (all.length/tot):0;
  var first='—', last='—', lastDate='—';
  for(k=0;k<all.length;k++) if(all[k][2].indexOf(num)>=0){ first=all[k][0]; break; }
  for(k=all.length-1;k>=0;k--) if(all[k][2].indexOf(num)>=0){
    last=all[k][0]; lastDate=all[k][1]; break; }
  /* 近期窗口 */
  var win=(rowsWin&&rowsWin.length)?rowsWin.length:30;
  var w=rowsWin||all.slice(-win), wc=0, wmiss=0, wmx=0;
  for(k=0;k<w.length;k++){
    if(w[k][2].indexOf(num)>=0){ wc++; if(wmiss>wmx) wmx=wmiss; wmiss=0; }
    else wmiss++;
  }
  var wexp=win*d.redCount/max;
  /* 卡片 */
  var s='<div class="statcard">';
  s+='<div class="sctop"><span class="scnum" style="background:'+col+'">'+pad(num)+'</span>'
    +'<b style="color:'+col+'">'+pad(num)+' 号</b>'
    +'<span style="margin-left:auto;font-size:12px;color:#aaa">'+lab+' · '+win+' 期</span></div>';
  /* 主指标 */
  s+='<div class="scmain">'
   +'<div class="sci"><em>'+miss+'</em><span>期没出了</span></div>'
   +'<div class="sci"><em style="color:'+col+'">'+tot+'</em><span>历史出现次数</span></div>'
   +'<div class="sci"><em>'+wc+'</em><span>'+lab+'次数</span></div>'
   +'</div>';
  /* 明细表 */
  s+='<div class="sctbl">';
  function row(a,b){ return '<div class="scr"><span>'+a+'</span><b>'+b+'</b></div>'; }
  s+=row('历史出现次数', tot+' 次');
  s+=row('平均间隔', avg.toFixed(1)+' 期');
  s+=row('<b style="color:#c62828">当前遗漏</b>', '<b style="color:#c62828">'+miss+' 期</b>');
  s+=row('最长遗漏', mx+' 期');
  s+=row('最近一次开出', '<b>'+lastDate+'</b>');
  s+=row(lab+'出现', wc+' 次');
  s+='</div>';
  s+='<div class="note" style="padding:8px 0 0">"'+miss+' 期没出"<b>不代表</b>下期更容易出——'
    +'该号每期出现概率恒为 '+(d.redCount/max*100).toFixed(2)+'%。</div>';
  return s+'</div>';
}

/* ---------- 出现次数 ---------- */
function freqData(isBlue){
  var d=D[S.lot], max=isBlue?d.blueMax:d.redMax, key=isBlue?3:2, cnt=[];

/* ---------- 冷热分布（方格） ---------- */
function heatData(isBlue){
  var d=D[S.lot], max=isBlue?d.blueMax:d.redMax, key=isBlue?3:2;
  var sc=scopeRows(S.heatWin||'month');
  var rows=sc.rows, N=sc.rows.length, cnt=[];
  for(var n=0;n<=max;n++) cnt[n]=0;
  for(var i=0;i<rows.length;i++){
    var arr=rows[i][key];
    for(var j=0;j<arr.length;j++) if(arr[j]>=0&&arr[j]<=max) cnt[arr[j]]++;
  }
  var per=isBlue?d.blueCount:d.redCount, p=per/max, exp=N*p, sd=Math.sqrt(N*p*(1-p))||1, out=[];
  for(var n2=1;n2<=max;n2++) out.push({num:n2,cnt:cnt[n2],exp:exp,z:(cnt[n2]-exp)/sd,dev:cnt[n2]-exp});
  return out;
}
function heatColor(z){
  if(z<=-1.5) return '#3b6fd4';
  if(z<=-0.5) return '#8ab0e8';
  if(z<0.5)   return '#b0b0b0';
  if(z<1.5)   return '#ee9182';
  return '#d63a2a';
}
function heatLabel(z){
  if(z<=-1.5) return '极冷'; if(z<=-0.5) return '偏冷';
  if(z<0.5) return '正常';   if(z<1.5) return '偏热'; return '极热';
}

function heatBlock(isBlue,title,tag){
  var rows=heatData(isBlue), max=isBlue?D[S.lot].blueMax:D[S.lot].redMax;

function randPick(){

    for(var j=0;j<cnt;j++) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    return out.sort(function(a,b){return a-b});
  };

/* 添加前的验证：blocking 错误 / 提醒 */
function pickCheck(){
  var d=D[S.lot], err=[], warn=[];
  if(S.pickRed.length<d.redCount) err.push('还需选 '+(d.redCount-S.pickRed.length)+' 个'+d.redLabel);
  else if(S.pickRed.length>d.redCount) err.push(d.redLabel+'多选了 '+(S.pickRed.length-d.redCount)+' 个');
  if(S.pickBlue.length<d.blueCount) err.push('还需选 '+(d.blueCount-S.pickBlue.length)+' 个'+d.blueLabel);
  else if(S.pickBlue.length>d.blueCount) err.push(d.blueLabel+'多选了 '+(S.pickBlue.length-d.blueCount)+' 个');
  var ov=[];
  S.pickBlue.forEach(function(b){ if(S.pickRed.indexOf(b)>=0) ov.push(pad(b)); });
  if(ov.length) warn.push(d.blueLabel+' '+ov.join('、')+' 与'+d.redLabel+'重复（不影响有效性）');
  if(!err.length){
    var bets=getBets(), dup=false;
    for(var i=0;i<bets.length;i++)
      if(sameArr(bets[i].r,S.pickRed)&&sameArr(bets[i].b,S.pickBlue)){ dup=true; break; }
    if(dup) err.push('该组合已在下方列表中');
  }
  return {err:err, warn:warn, ok:err.length===0};
}
function addBet(){
  var c=pickCheck();
  if(!c.ok){ alert(c.err.join('\n')); return; }
  var a=getBets();
  a.push({r:S.pickRed.slice(), b:S.pickBlue.slice(), t:Date.now()});
  saveBets(a); S.pickRed=[];S.pickBlue=[];
  render();
}
function delBet(i){ var a=getBets(); a.splice(i,1); saveBets(a); render(); }
function clearBets(){ saveBets([]); render(); }

function analyze(reds,blues){
  var d=D[S.lot], rows=d.rows;
  var bs={}, j;
  for(j=0;j<blues.length;j++) bs[blues[j]]=1;
  var exact=null, best={overlap:-1}, recentMax=0, kdist={}, prize={}, total=0;
  var nRec=Math.min(5,rows.length);
  for(var i=0;i<rows.length;i++){
    var r=rows[i], rk={};
    for(j=0;j<r[2].length;j++) rk[r[2][j]]=1;
    var k=0, shared=[];
    for(j=0;j<reds.length;j++) if(rk[reds[j]]){ k++; shared.push(reds[j]); }
    var hitB=0;
    for(j=0;j<r[3].length;j++) if(bs[r[3][j]]) hitB++;
    kdist[k]=(kdist[k]||0)+1;
    if(k===d.redCount && r[2].length===reds.length && !exact) exact={issue:r[0],date:r[1],blue:r[3]};
    if(k>best.overlap || (k===best.overlap && r[0]>best.issue))
      best={overlap:k,issue:r[0],date:r[1],red:r[2],shared:shared};
    if(i>=rows.length-nRec && k>recentMax) recentMax=k;
    if(S.lot==='ssq'){
      var p=ssqPrize(k,hitB>0);
      if(p){ prize[p.name]=(prize[p.name]||0)+1; if(p.amt) total+=p.amt; }
    }
  }
  return {exact:exact,best:best,recentMax:recentMax,kdist:kdist,prize:prize,total:total,draws:rows.length};
}
function ssqPrize(k,hb){
  if(k===6) return {name:hb?'一等奖':'二等奖', amt:null};
  if(k===5) return hb?{name:'三等奖',amt:3000}:{name:'四等奖',amt:200};
  if(k===4) return hb?{name:'四等奖',amt:200}:{name:'五等奖',amt:10};
  if(k===3) return hb?{name:'五等奖',amt:10}:null;
  if(hb)    return {name:'六等奖',amt:5};
  return null;
}

  for(var j=1;j<=d.blueMax;j++)

  /* 预览 + 实时校验提示 */

   + fmtBalls({2:S.pickRed,3:S.pickBlue},true)
   +'<div class="msg" style="margin-top:8px">';
  if(!S.pickRed.length && !S.pickBlue.length){
    h+='<span style="color:#aaa">请从上方选择号码</span>';
  } else {
    c.err.forEach(function(m){ h+='<div class="e">✗ '+esc(m)+'</div>'; });
    c.warn.forEach(function(m){ h+='<div class="w">! '+esc(m)+'</div>'; });
    if(c.ok) h+='<div class="ok">✓ 号码有效，可添加</div>';
  }
  h+='</div></div>';
  h+='<div class="btns">'
   +'<button class="'+(c.ok?'p':'dis')+'" onclick="addBet()">添加</button>'
   +'<button onclick="randPick()">随机一注</button>'
   +'<button class="g" onclick="clearPick()">清空选择</button>'
   +'</div></div>';

  h+='<div class="sec">已保存 '+bets.length+' 注'
   +(bets.length?'<span style="float:right;font-weight:400;color:#c33;cursor:pointer" onclick="clearBets()">清空</span>':'')+'</div>';
  if(!bets.length)
    h+='<div class="empty">还没有自选号码<br><span style="font-size:12px">在上面选择号码后点「添加」，或点「随机一注」</span></div>';
  for(var b=0;b<bets.length;b++){
    var bet=bets[b], r={2:bet.r,3:bet.b}, a=analyze(bet.r,bet.b);
    h+='<div class="betcard"><div class="bettop"><div>'+fmtBalls(r,true)+'</div>'
      +'<button class="del" onclick="delBet('+b+')">×</button></div>'
      +'<div style="font-size:12px;color:#666;margin-top:6px">和值 '+sumRed(r)+' · 奇偶比 '+oddStr(r)
      +(rbOverlap(r)?' · <span style="color:#c33">'+d.blueLabel+'与'+d.redLabel+'有重合</span>':'')+'</div>';
    if(a.exact)
      h+='<div class="kv"><span class="tagline tag-hot">历史开出过</span>'
        +esc(a.exact.issue)+' 期（'+esc(a.exact.date)+'）'+d.blueLabel+' '+a.exact.blue.map(pad).join(' ')+'</div>';
    else
      h+='<div class="kv"><span class="tagline tag-no">历史未出现过</span>该组'+d.redLabel+'在 '+a.draws+' 期中从未开出</div>';
    h+='<div class="kv">全史最相近 <b>'+esc(a.best.issue)+'</b>（'+esc(a.best.date)+'）重合 <b>'+a.best.overlap+'</b> 个'
      +' ['+a.best.shared.map(pad).join(' ')+']</div>';
    h+='</div>';
  }
  h+='<div class="note">自选号码保存在本机浏览器，不会上传。以上为历史统计，'
    +'任何号码的中奖概率相同，不构成预测。</div></div>';
  return h;
}

/* ---------- 侧边栏 ---------- */
function openSide(){ $('side').className='sidemask on'; }
function closeSide(){ $('side').className='sidemask'; }
function refreshData(){
  closeSide();
  delete D[S.lot]; showLoading();
  load(S.lot,true).then(render).catch(function(e){ showError(e.message||String(e)); });
}
function clearMyBets(){
  closeSide(); saveBets([]); if(S.tab==='mine') render();
}
function showSource(){
  var d=D[S.lot];
  $('modal').innerHTML='<div class="mask" onclick="if(event.target===this)closeHelp()"><div class="modal">'
   +'<div class="mh">数据来源<span onclick="closeHelp()">×</span></div><div class="mb">'
   +'<h4>双色球</h4><p>中国福利彩票发行管理中心官方接口（cwl.gov.cn）。</p>'
   +'<h4>大乐透</h4><p>中国体育彩票官方接口（lottery.sporttery.cn）。</p>'
   +'<h4>当前数据</h4><p>'+(d? esc(d.name)+'：'+d.rows.length+' 期（'+d.rows[0][0]+' ~ '+d.rows[d.rows.length-1][0]+'）'
     :'尚未加载')+'</p>'
   +'<h4>说明</h4><p>'+(typeof EMBEDDED_BUILD!=='undefined'&&EMBEDDED_BUILD?'本页面为离线单文件版，开奖数据已内置在文件中，打开即用、无需联网；数据源为官方接口，构建时抓取。':'页面本身不含任何内置数据，打开时实时抓取；服务端会缓存，')
   +'再次打开秒开。若官方接口临时不可用，会回退到上次缓存并提示。</p>'
   +'</div></div></div>';
}

   +'<li><b>黄底行</b>＝该期蓝球（后区）与红球（前区）号码有重合</li>'

   +'彩色圆点＝该期开出的号码（圆点内写号码，颜色与号码一致），空白＝未开出</li>'
   +'<li>底部蓝球条标出<b>最新一期</b>的蓝球</li>'
   +'<li>默认显示最新 <b>20 期</b>，点「加载更多」每次加 20 期，可展开到全部历史；'

   +'<li><b>单号统计</b>：先选号码，再选范围（<b>近一个月 / 近一年 / 全部</b>）。'
   +'三大指标＝<b>几期没出</b> / 历史出现次数 / 所选范围出现次数；'
   +'明细含平均间隔、当前遗漏、最长遗漏、<b>最近一次开出日期（年月日）</b>、'

   +'<h4>出现次数</h4><ul>'
   +'<li>统计全历史每个号码的<b>出现次数</b>与<b>占比</b>，红球区与蓝球区分别统计</li>'
   +'<li>默认按<b>出现次数升序 ▲</b>；点击表头（号码 / 出现次数 / 占比%）切换排序字段与升降序，'

function closeHelp(){ $('modal').innerHTML=''; }

/* ---------- 主流程 ---------- */
function head(){
  var d=D[S.lot], t=new Date(d.updatedAt*1000);
  var s='<div class="upd">数据更新于 '+t.toLocaleString('zh-CN')
    +(typeof EMBEDDED_BUILD!=='undefined'&&EMBEDDED_BUILD?'（数据已内置于本页面，无需联网）':(d.source==='live'?'（实时抓取）':'（缓存）'))+'</div>';
  if(d.stale) s+='<div class="card"><div class="warn">当前为上次缓存数据（官方接口暂时不可用），稍后会自动恢复实时。</div></div>';
  return s;
}
function latest(){
  var d=D[S.lot], r=d.rows[d.rows.length-1];
  if(!r) return '';
  return '<div class="card"><div class="sec">最新一期（'+d.name+'）</div>'
    +'<div style="padding:12px"><div style="font-size:12px;color:#888">'+r[0]+' 期 · '+r[1]+'</div>'
    +'<div style="margin:8px 0">'+fmtBalls(r,true)+'</div>'
    +'<div style="font-size:12px;color:#666">和值 '+sumRed(r)+' · 奇偶比 '+oddStr(r)
    +(rbOverlap(r)?' · <span style="color:#c33">'+d.blueLabel+'与'+d.redLabel+'有重合</span>':'')+'</div></div></div>';
}
function setLot(l){S.lot=l;S.listLimit=60;S.pickRed=[];S.pickBlue=[];S.trendSel={};boot()}
function setTab(t){S.tab=t;render()}
function render(){
  if(!D[S.lot]){showLoading();return}
  $('b-ssq').className = S.lot==='ssq'?'on':'';
  $('b-dlt').className = S.lot==='dlt'?'on':'';
  ['list','trend','freq','heat','mine'].forEach(function(t){$('t-'+t).className = S.tab===t?'on':''});
  $('t-menu').className = '';
  var m=$('main'), h=head()+latest();
  if(S.tab==='list') h+=renderList();
  else if(S.tab==='trend') h+=renderTrend();
  else if(S.tab==='freq') h+=renderFreq();
  else if(S.tab==='heat') h+=renderHeat();
  else h+=renderMine();
  m.innerHTML=h;
}
function boot(){
  ensure(S.lot).then(function(){
    render();
    var seen=null; try{ seen=localStorage.getItem(HELP_SEEN); }catch(e){}
    if(!seen) showHelp();
  }).catch(function(){});
}
boot();
</script>
