name: 定时刷新彩票数据

# ─────────────────────────────────────────────────────────────
# 为什么这么排：
#
# 1) 分钟数刻意避开整点和 0/15/30/45。
#    GitHub 官方说明：高负载期（尤其整点）schedule 会延迟 5~30 分钟，
#    负载过高时 job 甚至被直接丢弃。用 17/37/43 这类分钟可显著降低延迟。
#
# 2) 按开奖日精确排期（已用历史数据反推验证）：
#      双色球 → 周二、周四、周日（21:15 开奖）
#      大乐透 → 周一、周三、周六（20:30 开奖）
#    cron 星期字段：0=周日, 1=周一, ... 6=周六
#
# 3) 更关键：job 内部还会轮询等官方出数据（--poll-minutes）。
#    因为官方接口也不是开奖瞬间就有，通常晚几分钟。
#    所以 cron 早到/晚到都无所谓，到了就一直等到出新期号为止。
#
# cron 用 UTC（北京 = UTC+8）：
#    北京 21:37 → UTC 13:37
#    北京 20:47 → UTC 12:47
#    北京 09:13 → UTC 01:13
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # 双色球开奖日（周二 2、周四 4、周日 0），北京 21:37，开奖后 22 分钟
    - cron: '37 13 * * 2,4,0'
    # 双色球冗余补跑，北京 22:43（防止上一次因故没抓到）
    - cron: '43 14 * * 2,4,0'

    # 大乐透开奖日（周一 1、周三 3、周六 6），北京 20:47，开奖后 17 分钟
    - cron: '47 12 * * 1,3,6'
    # 大乐透冗余补跑，北京 21:53
    - cron: '53 13 * * 1,3,6'

    # 每日兜底：北京 09:13（非开奖日的次日也能兜住漏网之鱼）
    - cron: '13 1 * * *'

  workflow_dispatch:
    inputs:
      poll_minutes:
        description: '轮询等待分钟数（0=不等待）'
        type: string
        default: '12'

  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - '**.md'

permissions:
  contents: write

concurrency:
  group: lottery-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # 轮询最多 14 分钟，留足余量
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: 打印触发来源与时间
        run: |
          echo "触发 schedule: ${{ github.event.schedule || '(手动/推送)' }}"
          echo "UTC  现在: $(date -u '+%F %H:%M')"
          echo "北京 现在: $(TZ='Asia/Shanghai' date '+%F %H:%M')"

      - name: 抓取并生成产物（开奖日轮询等数据）
        id: gen
        run: |
          POLL="${{ github.event.inputs.poll_minutes }}"
          [ -z "$POLL" ] && POLL=12
          python3 cron_refresh.py --poll-minutes "$POLL" 2>&1 | tee cron.log
          echo "changed=$(grep -c 'CHANGED=yes' cron.log || true)" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: 显示结果
        run: cat cron.log || true

      - name: 提交更新后的数据
        if: steps.gen.outputs.changed != '0'
        run: |
          git config user.name  "lottery-bot"
          git config user.email "bot@example.com"
          git add dist/
          git diff --staged --quiet || git commit -m "chore(data): 自动刷新开奖数据 $(TZ='Asia/Shanghai' date '+%F %H:%M')"
          git push

      # ───────── 心跳提交 ─────────
      # 用途：GitHub 会在「公开仓库 60 天无任何 activity」时
      #       自动禁用定时任务（静默失效，不通知）。
      #       每天留一个 commit，就能保证定时任务永不过期。
      #       文件放在 dist/ 下，被上面的 paths-ignore 排除，
      #       因此不会触发本工作流循环执行。
      - name: 心跳提交（保持定时任务不被禁用）
        if: steps.gen.outputs.changed == '0'
        run: |
          git config user.name  "lottery-bot"
          git config user.email "bot@example.com"
          mkdir -p dist
          echo "$(TZ='Asia/Shanghai' date '+%F %H:%M') 数据无变化" > dist/.last-check
          git add dist/.last-check
          git diff --staged --quiet || git commit -m "chore: heartbeat $(TZ='Asia/Shanghai' date '+%F %H:%M')"
          git push

      # ───────── 可选：直接上传到腾讯云 CloudBase 静态托管 ─────────
      # 在仓库 Settings → Secrets 加两个变量后取消注释：
      #   TCB_ENV_ID   环境 ID（形如 xxx-1a2b3c4d）
      #   TCB_SECRET   腾讯云密钥对，格式 SecretId#SecretKey
      # - name: 上传到 CloudBase
      #   if: steps.gen.outputs.changed != '0'
      #   env:
      #     TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      #     TCB_SECRET: ${{ secrets.TCB_SECRET }}
      #   run: |
      #     npm i -g @cloudbase/cli
      #     tcb login --apiKeyId "${TCB_SECRET%%#*}" --apiKey "${TCB_SECRET##*#}"
      #     tcb hosting deploy dist/单文件版/彩票统计.html 彩票统计.html -e "$TCB_ENV_ID"
